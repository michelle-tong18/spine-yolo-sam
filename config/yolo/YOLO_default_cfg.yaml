# Ultralytics YOLO 🚀, AGPL-3.0 license

epochs: 300 # (int) number of epochs to train for
time: # (float, optional) number of hours to train for, overrides epochs if supplied
batch: -1 # (int) number of images per batch (-1 for AutoBatch)
imgsz: 1024 # (int | list) input images size as int for train and val modes, or list[h,w] for predict and export modes
save: True # (bool) save train checkpoints and predict results
save_period: 25 # (int) Save checkpoint every x epochs (disabled if < 1)
# device: # (int | str | list, optional) device to run on, i.e. cuda device=0 or device=0,1,2,3 or device=cpu
workers: 4 # (int) number of worker threads for data loading (per RANK if DDP)
project: # (str, optional) project name
name: # (str, optional) experiment name, results saved to 'project/name' directory
exist_ok: False # (bool) whether to overwrite existing experiment
# pretrained: True # (bool | str) whether to use a pretrained model (bool) or a model to load weights from (str)
verbose: True # (bool) whether to print verbose output
plots: True #False
resume: False

# YOLO finetuning settings
rect: False #False, rectangular training
patience: 0 #early stopping
# false | disk | ram (True → ram). disk matches deterministic=True; ram is faster but non-deterministic.
cache: disk
optimizer: 'auto' #['auto', 'SGD', 'Adam', 'AdamW', 'NDadam', 'Radam', 'RMSProp']
seed: 0 #0
single_cls: False #False, set to binary class
cos_lr: False #False
close_mosaic: 50 #10, disable mosaic in last N epochs
amp: True #True
freeze: None #None, freeze first N layers
lr0: 0.01 #0.01
lrf: 0.01 #0.01
momentum: 0.937 # 0.937
weight_decay: 0.0005 #0.0005
warmup_epochs: 3.0 #3.0
warmup_momentum: 0.8 #0.8
warmup_bias_lr: 0.1 #0.1
box: 5.5 #7.5 box loss
cls: 2.5 #0.5 class loss
dfl: 1.5 #1.5 distribution focal loss
label_smoothing: 0.0 #0.0
overlap_mask: True #True
mask_ratio: 4 #4
dropout: 0.0 #0.0
# Augmentation settings
hsv_h: 0.0 #0.015
hsv_s: 0.5 #0.7
hsv_v: 0.5 #0.4
degrees: 15 #0.0
translate: 0.1 #0.1
scale: 0.1 #0.5
shear: 0.0 #0.0
flipud: 0.0 #0.0
fliplr: 0.0 #0.5 — off by default (preserves L/R laterality)
mosaic: 0.5 #1.0
mixup: 0.0 #0.0
copy_paste: 0.0 #0.0
auto_augment: None #randaugment, autoaugment, augmix
erasing: 0.1 #0.4
crop_fraction: 0.1 #1.0